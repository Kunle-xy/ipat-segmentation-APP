services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ipat
      POSTGRES_USER: ipat
      POSTGRES_PASSWORD: ipat
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ipat", "-d", "ipat"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - ipat-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: ipat-backend
    environment:
      - DATABASE_URL=postgresql://ipat:ipat@postgres:5432/ipat
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3010}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    ports:
      - "${BACKEND_PORT:-8010}:8010"
    volumes:
      # Mount backend code for development hot-reload
      - ./backend:/app
    command: >
      uvicorn main:app
      --host ${BACKEND_HOST:-0.0.0.0}
      --port 8010
      --reload
      --log-level info
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - ipat-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8010}
    container_name: ipat-frontend
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8010}
      - NEXT_PUBLIC_UPLOAD_MODE=direct
      - NODE_ENV=development
    ports:
      - "${FRONTEND_PORT:-3010}:3010"
    volumes:
      # Mount frontend code for development hot-reload
      - ./frontend:/app
      # Prevent node_modules and .next from being overwritten
      - /app/node_modules
      - /app/.next
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ipat-network

networks:
  ipat-network:
    driver: bridge
    name: ipat-network

volumes:
  postgres-data:
