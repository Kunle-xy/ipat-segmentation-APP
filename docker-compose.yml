version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ipat-backend
    env_file:
      - .env
    environment:
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      - GCP_DATASET_ID=${GCP_DATASET_ID:-ipat_dataset}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS:-/app/gcp-service-account.json}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3010}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    ports:
      - "${BACKEND_PORT:-8010}:8010"
    volumes:
      # Mount backend code for development hot-reload
      - ./backend:/app
      # Mount GCP credentials (ensure this file exists)
      - ./backend/gcp-service-account.json:/app/gcp-service-account.json:ro
    command: >
      uvicorn main:app
      --host ${BACKEND_HOST:-0.0.0.0}
      --port 8010
      --reload=${BACKEND_RELOAD:-true}
      --log-level ${LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - ipat-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8010}
    container_name: ipat-frontend
    env_file:
      - .env
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8010}
      - NODE_ENV=${NODE_ENV:-development}
    ports:
      - "${FRONTEND_PORT:-3010}:3010"
    volumes:
      # Mount frontend code for development hot-reload
      - ./frontend:/app
      # Prevent node_modules and .next from being overwritten
      - /app/node_modules
      - /app/.next
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ipat-network

networks:
  ipat-network:
    driver: bridge
    name: ipat-network

# Note: This setup uses Google BigQuery as the database
# No local database container is needed
